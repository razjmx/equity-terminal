name: Fetch industry classification (NSE)
on:
  schedule:
    - cron: "0 4 1 * *"   # monthly, 1st at 09:30 IST
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"
      only_new:
        description: "yes = look up only stocks not in industry.csv yet (use after the universe grows)"
        default: "no"
        type: choice
        options:
          - "no"
          - "yes"

permissions:
  contents: write

concurrency:
  group: industry
  cancel-in-progress: false

jobs:
  industry:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      ONLY_NEW: ${{ github.event.inputs.only_new == 'yes' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests

      - name: Industry classification (NSE list + Yahoo)
        run: python scripts/fetch_industry.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Industry classification $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
