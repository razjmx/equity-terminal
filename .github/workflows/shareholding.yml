name: Fetch shareholding (NSE)
on:
  schedule:
    - cron: "30 3 * * 0"   # Sundays 09:00 IST
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: shareholding
  cancel-in-progress: false

jobs:
  shareholding:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests

      - name: Shareholding from NSE
        run: python scripts/fetch_shareholding.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Shareholding refresh $(date -u +%F)" || echo "No changes"
          git pull --rebase
          git push
