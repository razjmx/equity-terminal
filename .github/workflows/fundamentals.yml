name: Fetch fundamentals
on:
  workflow_dispatch:
    inputs:
      only_new:
        description: "yes = fetch only stocks that have no file yet (use after the universe grows); no = all stocks"
        default: "yes"
        type: choice
        options:
          - "yes"
          - "no"

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      ONLY_NEW: ${{ inputs.only_new == 'yes' && '1' || '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/fetch_fundamentals.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/fundamentals data/fundamentals_status.csv
          git commit -m "Update fundamentals" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
