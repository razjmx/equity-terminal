name: Live data test
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install growwapi pyotp
      - name: Test the Groww connection
        env:
          GROWW_TOTP_TOKEN: ${{ secrets.GROWW_TOTP_TOKEN }}
          GROWW_TOTP_SECRET: ${{ secrets.GROWW_TOTP_SECRET }}
        run: python scripts/fetch_live_test.py
      - name: Commit the log
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/live_test_log.txt
          git commit -m "Live data test" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
