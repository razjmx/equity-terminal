name: Order flow (5-minute bars)
on:
  schedule:
    - cron: "30 10 * * 1-5"   # 16:00 IST, after the close
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: orderflow
  cancel-in-progress: false

jobs:
  orderflow:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests

      - name: Order flow analysis
        run: python scripts/fetch_orderflow.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Order flow $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
