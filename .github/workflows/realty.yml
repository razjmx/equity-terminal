name: Compute realty and REIT
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  realty:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/compute_realty.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/realty data/realty_summary.csv data/realty_review.txt data/realty_errors.txt data/realty_inputs.csv
          git commit -m "Compute realty and REIT" || echo "No changes"
          git pull --rebase
          git push
