name: Order flow extras (FII holding, back-test)
on:
  schedule:
    - cron: "30 16 * * 1-5"   # 22:00 IST, after Order flow
  workflow_dispatch:
    inputs:
      backtest:
        description: "Also run the back-test (about 10 minutes)"
        default: "true"

permissions:
  contents: write

concurrency:
  group: orderflow-extra
  cancel-in-progress: false

jobs:
  extra:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests scipy

      - name: FII / FPI holding change
        run: python scripts/compute_fii_flow.py

      - name: Back-test of the order-flow score
        if: github.event_name == 'schedule' || github.event.inputs.backtest == 'true'
        continue-on-error: true
        run: python scripts/backtest_orderflow.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Order flow extras $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
