name: Compute metrics
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  compute:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/compute_metrics.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/metrics data/metrics_summary.csv data/metrics_errors.txt data/metrics_check.txt
          git commit -m "Compute metrics" || echo "No changes"
          git push
