name: Quant models
on:
  schedule:
    - cron: "30 15 * * 1-5"   # 21:00 IST: after the daily price refresh and order flow runs
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: quant
  cancel-in-progress: false

jobs:
  quant:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests scipy

      - name: Quant models (volatility, trend, factors, PCA)
        run: python scripts/compute_quant.py

      - name: Barra-style factor risk model
        continue-on-error: true
        run: python scripts/compute_barra.py

      - name: Pairs (stat-arb) scan
        continue-on-error: true
        run: python scripts/compute_statarb.py

      - name: Intraday volume profile (VWAP / TWAP)
        continue-on-error: true
        run: python scripts/fetch_intraday.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Quant models $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
