name: NSE index levels
on:
  schedule:
    - cron: "30 14 * * 1-5"   # 20:00 IST: after NSE publishes the day's index file
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nse-indices
  cancel-in-progress: false

jobs:
  indices:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests

      - name: NSE index levels for the heatmap
        run: python scripts/fetch_nse_indices.py

      - name: Stock lists of each index
        continue-on-error: true
        run: python scripts/fetch_index_constituents.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "NSE index levels $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
