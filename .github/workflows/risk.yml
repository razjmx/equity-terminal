name: Compute risk and technicals
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  risk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python scripts/compute_risk.py
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/risk data/risk_summary.csv data/risk_review.txt data/risk_check.txt data/risk_errors.txt data/market.json data/breadth_history.csv
          git commit -m "Compute risk and technicals" || echo "No changes"
          git push
