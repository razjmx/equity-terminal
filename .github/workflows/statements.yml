name: Fetch financial statements
on:
  schedule:
    - cron: "30 2 * * 0"   # Sundays 08:00 IST
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"
      force:
        description: "Re-download even if fresh (1 = yes)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: statements
  cancel-in-progress: false

jobs:
  statements:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
      FORCE: ${{ github.event.inputs.force || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt requests

      - name: Statements (income, balance sheet, cash flow)
        run: python scripts/fetch_statements.py

      - name: Shareholding probe (NSE)
        continue-on-error: true
        run: python scripts/probe_shareholding.py

      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "Statements refresh $(date -u +%F)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
