name: News
on:
  schedule:
    - cron: "40 3,9,15 * * 1-5"   # 09:10, 15:10 and 21:10 IST on weekdays
  workflow_dispatch:
    inputs:
      limit:
        description: "Only first N stocks (0 = all)"
        default: "0"

permissions:
  contents: write

concurrency:
  group: news
  cancel-in-progress: false

jobs:
  news:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LIMIT: ${{ github.event.inputs.limit || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch headlines
        run: python scripts/fetch_news.py
      - name: Commit data
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data
          git commit -m "News $(date -u +%F-%H)" || echo "No changes"
          for i in 1 2 3 4 5; do
            git pull --rebase && git push && break
            sleep $((i*5))
          done
